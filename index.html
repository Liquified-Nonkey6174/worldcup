<title>A Slightly Moderately Large World Cup</title>

<style>
:root {
  /* Layout: scoreboard bar above a 16:9 side-on pitch; menu, pause and result cards float over the pitch.
     Single deliberate look (floodlit match day), so every color is set explicitly in both themes. */
  color-scheme: dark;
  --bg: #0F1B17;
  --panel: #17271F;
  --line: #2B4237;
  --fg: #EDF4EE;
  --muted: #9FB8AA;
  --you: #F2542D;
  --cpu: #3B78E0;
  --accent: #F6C945;
  --accent-ink: #1B1606;
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.app {
  width: 100%;
  max-width: 1040px;
  min-width: 0;
  margin-block: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hud {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 14px;
}
.side { display: flex; align-items: center; gap: 10px; min-width: 0; }
.side.cpu { justify-content: flex-end; }
.swatch { width: 14px; height: 14px; border-radius: 50%; flex: none; background-size: cover; background-position: center; }
.you .swatch { background: var(--you); }
.cpu .swatch { background: var(--cpu); }
.tag {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.score {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 34px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.clock {
  text-align: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 26px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  min-width: 96px;
}
.clock small {
  display: block;
  margin-top: 4px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #2F7A43;
  touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  background: rgba(9, 18, 14, 0.66);
  backdrop-filter: blur(3px);
}
.overlay[hidden] { display: none; }
.card {
  width: min(440px, 100%);
  max-height: 100%;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px 20px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.card h1, .card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  line-height: 1.05;
  text-wrap: balance;
}
.card h1 { font-size: clamp(24px, 5vw, 32px); }
.card h2 { font-size: clamp(26px, 5vw, 34px); }
.sub { margin: 6px 0 0; color: var(--muted); }
.how { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.opt { display: flex; flex-direction: column; gap: 6px; }
.opt > span { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: 600 14px var(--font-body);
  padding: 7px 10px;
  border-radius: 7px;
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.primary, .ghost {
  font: 600 16px var(--font-body);
  padding: 11px 16px;
  border-radius: 10px;
  cursor: pointer;
  border: 1px solid transparent;
}
.primary { background: var(--accent); color: var(--accent-ink); }
.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.skillrow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.skillrow > span { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.skillrow b { font-family: var(--font-display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.range { width: 100%; margin: 2px 0; accent-color: var(--accent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1; }
.result { font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
.card.wide { width: min(720px, 100%); }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 6px; }
.team {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; text-align: left;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  color: var(--fg); font: 600 14px var(--font-body); cursor: pointer;
}
.team:hover { border-color: var(--accent); }
.team[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip { background-size: cover; background-position: center; width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid rgba(255,255,255,0.4); }
.bracket { display: grid; grid-template-columns: repeat(4, minmax(66px, 1fr)); gap: 6px; }
.bcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bcol h3 { margin: 0; font: 600 10px var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.bms { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 6px; }
.bm { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 12px; }
.bm.me { border-color: var(--accent); }
.bt { display: flex; align-items: center; gap: 5px; padding: 3px 6px; min-height: 22px; }
.bt.w { font-weight: 700; }
.bt.l { color: var(--muted); }
.dense .bt { min-height: 19px; padding: 2px 5px; font-size: 11px; }
.dense .bm { font-size: 11px; }
.dense6 .bt { min-height: 16px; padding: 1px 4px; font-size: 10px; }
.dense6 .bms { gap: 3px; }
.bt .sc { margin-left: auto; font-variant-numeric: tabular-nums; }
.bt .chip { width: 9px; height: 9px; border-width: 1px; }
.card.xl { width: min(920px, 100%); }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.grp { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px 8px; font-size: 12px; }
.grp.me { border-color: var(--accent); }
.grp h3 { margin: 0 0 4px; font: 600 10px var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.gr { display: grid; grid-template-columns: 1fr 18px 28px 28px; align-items: center; gap: 4px; padding: 2px 0 2px 6px; border-left: 3px solid transparent; }
.gr.q { border-left-color: var(--accent); }
.gr.q3 { border-left-color: #9a8a3c; }
.gr.cut { border-bottom: 1px dashed var(--line); padding-bottom: 4px; margin-bottom: 2px; }
.gr small { color: var(--muted); font-size: 10px; }
.thirds { max-width: 330px; }
.gr.hd { color: var(--muted); font-size: 10px; }
.gr .n { display: flex; align-items: center; gap: 5px; min-width: 0; }
.gr .v { text-align: right; font-variant-numeric: tabular-nums; }
.lgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.lg { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; font-weight: 600; }
.lg .t { display: flex; align-items: center; gap: 6px; min-width: 0; }
.lg .t.r { justify-content: flex-end; }
.lg .sc { font-family: var(--font-display); font-weight: 800; font-size: 18px; min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; }
.lg .sc span { display: inline-block; }
.pop { animation: pop 0.5s ease-out; }
@keyframes pop { 0% { transform: scale(1.7); color: var(--accent); } 100% { transform: scale(1); } }
.mins { margin: 0; font: 700 14px var(--font-body); color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: 0.06em; text-transform: uppercase; }
.champ { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  color: var(--muted);
  font-size: 13px;
}
.bar p { margin: 0; min-width: 0; }
.btns { display: flex; gap: 8px; }
.btn {
  font: 600 13px var(--font-body);
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
@media (max-width: 700px) { .overlay.full { position: fixed; z-index: 20; } }
@media (max-width: 520px) {
  .hud { padding: 8px 10px; gap: 8px; }
  .score { font-size: 28px; }
  .clock { font-size: 22px; min-width: 76px; }
  .tag { font-size: 11px; letter-spacing: 0.1em; }
  .card { padding: 14px; gap: 10px; }
  .how { font-size: 13px; }
}
html.rot body { padding: 0; display: block; }
html.rot .app { position: fixed; top: 0; left: 100vw; width: 100vh; width: 100dvh; height: 100vw; height: 100dvw; max-width: none; margin: 0;
  padding: 10px 14px; justify-content: center; transform-origin: 0 0; transform: rotate(90deg); overflow: hidden; }
html.rot .stage { width: min(100%, calc((100vw - 120px) * 16 / 9)); margin-inline: auto; }
html.rot .bar p { display: none; }
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto; }
}
</style>

// Arena proportions match the reference clip: 16:9 field, feet-level ground ~89% of the way down,

const W = 960, H = 540, GROUND = 482;
const GOAL_H = 180, GOAL_W = 70, BAR = 8;
const CROSS_BOT = GROUND - GOAL_H, CROSS_TOP = CROSS_BOT - BAR;
const PR = 38, BR = 15, PM = 5;
// Matched to a reference clip (measured at 30fps): player gravity ~800 px/s^2, ball ~550 px/s^2,
// launch speed at 80% of a full pull ~1110 px/s, so a full pull is ~1390 px/s. No air drag.
const G_P = 800, G_B = 550;
const DASH = 1390, KICK = 100, DASH_TIME = 0.22;
const MAXR = 380;   // drag length (and aim-arrow reach) for a full-power launch
const STEP = 1 / 120;
const MAX_BALL = 1500;
const HUMAN_CD = 0.22;   // launch cooldown (was 0.42)
let C_YOU = '#F2542D', C_CPU = '#3B78E0', D_YOU = '#8F2C14', D_CPU = '#1C3F85';
/* ---------- CPU skill rating ----------
   One number from 1 (beginner) to 100 (elite) drives how the CPU plays. Every trait slides smoothly with it:
     speed       shorter launch cooldown and quicker reactions
     perception  reads the ball further ahead and dares to strike from further away
     judgement   how often it stops to defend its goal
     precision   aim and power wobble, and how often it hesitates (the randomness; it shrinks as skill rises)
   Skill 1 is slow and sloppy; skill 100 is fast and nearly exact, but still never perfectly repeatable. */
const lerp = (a, b, t) => a + (b - a) * t;
function gauss() {   // roughly normal, clipped to +-2 standard deviations
  return Math.max(-2, Math.min(2, (Math.random() + Math.random() + Math.random() + Math.random() - 2) * 1.73));
}
function aiParams(skill) {
  const t = Math.max(0, Math.min(1, (skill - 1) / 99)), sloppy = Math.pow(1 - t, 1.5);
  return {
    t,
    cd: lerp(0.42, 0.16, t),                    // seconds between launches (you recharge in 0.22)
    react: lerp(0.30, 0.0, Math.pow(t, 0.7)),   // seconds it waits after a launch recharges
    lead: lerp(0.08, 0.45, t),                  // seconds ahead it predicts the ball
    hitR: lerp(90, 210, t),                     // how far away it will swing at the ball
    keep: Math.max(0, Math.min(1, (skill - 15) / 45)),  // how often it thinks about defending
    aimErr: 0.01 + 0.28 * sloppy,               // aim wobble, radians (one standard deviation)
    powErr: 0.01 + 0.22 * sloppy,               // power wobble, fraction of the launch
    slip: 0.18 * Math.pow(1 - t, 2)             // chance of a brain-fade before a move
  };
}
function skillName(s) {
  return s < 20 ? 'Beginner' : s < 40 ? 'Casual' : s < 60 ? 'Club' : s < 80 ? 'Advanced' : s < 95 ? 'Expert' : 'Elite';
}

];

function flagBox(g, id, x, y, w, h) { g.save(); g.translate(x, y); g.scale(w, h); FLAGS[id](g); g.restore(); }
const flagUrls = {};
function flagURL(id) {   // round flag badge for the menus and HUD
  if (flagUrls[id] !== undefined) return flagUrls[id];
  let u = '';
  try {
    const c = document.createElement('canvas'); c.width = c.height = 48;
    const g = c.getContext('2d');
    g.beginPath(); g.arc(24, 24, 24, 0, Math.PI * 2); g.clip();
    flagBox(g, id, -7.4, 0, 62.8, 48);
    u = c.toDataURL('image/png') || '';
  } catch (e) { u = ''; }
  return (flagUrls[id] = u);
}
const chipStyle = t => t.id && flagURL(t.id) ? 'background-image:url(' + flagURL(t.id) + ')' : 'background:' + t.c;

let youTeam = null, cpuTeam = null;
const cpuLabel = () => cpuTeam ? cpuTeam.name : 'CPU';
function applyKits() {
  C_YOU = youTeam ? youTeam.c : '#F2542D';
  if (cpuTeam) {
    C_CPU = colDist(C_YOU, cpuTeam.c) < 120 ? cpuTeam.alt : cpuTeam.c;
    if (colDist(C_YOU, C_CPU) < 120) C_CPU = '#3B78E0';
  } else C_CPU = colDist(C_YOU, '#3B78E0') < 120 ? '#F6C945' : '#3B78E0';
  D_YOU = shade(C_YOU, 0.55); D_CPU = shade(C_CPU, 0.55);
  const root = document.documentElement.style;
  root.setProperty('--you', C_YOU); root.setProperty('--cpu', C_CPU);
  const sy = $('swYou'), sc = $('swCpu');
  sy.style.backgroundImage = youTeam && flagURL(youTeam.id) ? 'url(' + flagURL(youTeam.id) + ')' : 'none';
  sc.style.backgroundImage = cpuTeam && flagURL(cpuTeam.id) ? 'url(' + flagURL(cpuTeam.id) + ')' : 'none';
  $('tYou').textContent = youTeam ? 'You · ' + youTeam.id : 'You';
  $('tCpu').textContent = cpuTeam ? cpuTeam.id : 'CPU';
}

  const min = PR + BR;
  if (d >= min) return;
  let nx, ny;
  if (d < 1e-4) {
    nx = -p.face; ny = -0.2;
    const l = Math.hypot(nx, ny); nx /= l; ny /= l; d = 0;
  } else { nx = dx / d; ny = dy / d; }
  const ov = min - d;
  let wb = 0.85, wp = 0.15;
  if (b.y + BR >= GROUND - 2 && ny > 0.2) { wb = 0.2; wp = 0.8; }
  b.x += nx * ov * wb; b.y += ny * ov * wb;
  p.x -= nx * ov * wp; p.y -= ny * ov * wp;
  const rvn = (b.vx - p.vx) * nx + (b.vy - p.vy) * ny;
  if (rvn < 0) {
    const j = -(1 + 0.55) * rvn / (1 + 1 / PM);
    b.vx += j * nx; b.vy += j * ny;
    p.vx -= j / PM * nx; p.vy -= j / PM * ny;
    if (p.dashT > 0 && !p.kicked) {
      p.kicked = true;
      const kk = KICK * p.power;
      b.vx += nx * kk; b.vy += ny * kk;
    }
    hitFx(-rvn, b.x - nx * BR, b.y - ny * BR);
  }
}
function playerPlayer() {
  const a = human, b = cpu;
  let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  const min = PR * 2;
  if (d >= min) return;
  if (d < 1e-4) { dx = 1; dy = 0; d = 1; }
  const nx = dx / d, ny = dy / d, ov = (min - d) / 2;
  a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
  const rvn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (rvn < 0) {
    const j = -(1 + 0.4) * rvn / 2;
    a.vx -= j * nx; a.vy -= j * ny; b.vx += j * nx; b.vy += j * ny;
  }
}
function checkGoal() {
  const b = ball;
  if (b.y > CROSS_BOT && b.y < GROUND) {
    if (b.x < GOAL_W - BR + 1) return 1;        // ball in the left goal: CPU scores
    if (b.x > W - GOAL_W + BR - 1) return 0;    // ball in the right goal: you score
  }
  return -1;
}
function simulate(dt) {
  stepPlayer(human, dt); stepPlayer(cpu, dt); stepBall(dt);
  playerPlayer(); ballPlayer(human); ballPlayer(cpu);
  playerBounds(human); playerBounds(cpu); ballBounds();
  // keep the feet pointing the right way
  for (const p of [human, cpu]) {
    let tx, ty;
    if (p.dashT > 0) { tx = p.dx; ty = p.dy; } else { tx = p.face; ty = 0.35; }
    p.fx += (tx - p.fx) * Math.min(1, dt * 18);
    p.fy += (ty - p.fy) * Math.min(1, dt * 18);
  }
  if (S.mode === 'play') {
    const g = checkGoal();

  }
}
let acc = 0;
function runSim(dt) {
  acc += dt;
  while (acc >= STEP) { simulate(STEP); acc -= STEP; }
}

/* ---------- launching (shared by you and the CPU) ---------- */
function launch(p, tx, ty, pw) {
  if (p.cd > (p.side === 0 ? 0.08 : 0)) return false;
  let dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
  if (d < 6) { dx = p.face; dy = -0.4; d = Math.hypot(dx, dy); }
  const ux = dx / d, uy = dy / d;
  const power = pw || powerFor(d);
  p.power = power;
  p.vx = ux * DASH * power; p.vy = uy * DASH * power;
  p.dashT = DASH_TIME; p.kicked = false; p.cd = p.cdMax;
  p.dx = ux; p.dy = uy;
  spawnDash(p, ux, uy);
  if (p.side === 0) tone(260, 520, 0.1, 'triangle', 0.06);
  return true;
}

/* ---------- CPU ---------- */
function segDist(ax, ay, bx, by, px, py) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  return Math.hypot(ax + dx * t - px, ay + dy * t - py);
}
// Where the ball will be when it reaches x = tx, following its bounces off the ground, ceiling and left wall.
function predictAt(tx) {
  let x = ball.x, y = ball.y, vx = ball.vx, vy = ball.vy;
  const h = 1 / 60;
  for (let i = 0; i < 90; i++) {
    vy += G_B * h; x += vx * h; y += vy * h;
    if (y + BR > GROUND) { y = GROUND - BR; if (vy > 0) { vy = -vy * 0.8; if (vy > -40) vy = 0; } }
    if (y < BR) { y = BR; if (vy < 0) vy = -vy * 0.9; }
    if (x < BR) { x = BR; vx = Math.abs(vx) * 0.8; }
    if (x >= tx && vx > 0) return { t: (i + 1) * h, y };
  }
  return null;
}
function aiThink(dt) {
  const c = cpu, b = ball, d = aiParams(settings.skill);
  // re-roll every so often whether the CPU is in a defensive frame of mind
  c.gt = (c.gt || 0) - dt;
  if (c.gt <= 0) { c.gt = 0.4; c.guard = Math.random() < d.keep; }
  d.guard = !!c.guard;
  if (c.cd > 0) { c.ai = d.react * (0.7 + Math.random() * 0.6); return; }
  c.ai -= dt;
  if (c.ai > 0) return;
  // brain-fade: now and then the CPU hesitates before acting (rarer as skill rises)
  if (Math.random() < d.slip) { c.ai = 0.15 + d.react * 2; return; }
  const lead = d.lead;
  const px = clamp(b.x + b.vx * lead, BR, W - BR);
  const py = clamp(b.y + b.vy * lead + 0.5 * G_B * lead * lead, BR, GROUND - BR);
  const dist = Math.hypot(px - c.x, py - c.y);
  const behind = c.x > px + 6;
  let tx, ty, pw = 0;
  const incoming = d.guard && b.vx > 120 && b.x + b.vx * 0.7 > W * 0.7;
  if (incoming && !behind && Math.hypot(b.x - c.x, b.y - c.y) < 170) {
    return;   // too close to get in front of it; a dash from here would only shove it toward the CPU's goal
  } else if (incoming && (!behind || b.vx > 450)) {
    // A shot is heading for the CPU's goal and the CPU can't get behind it: block the path in front of the goal.
    tx = W - 90;
    const hit = predictAt(tx);
    ty = clamp(hit ? hit.y : GROUND - PR, CROSS_BOT + 25, GROUND - PR);
    if (Math.abs(c.x - tx) < 35 && c.y - ty < 45) return;   // already in place
    const hgt = c.y - ty;
    if (hgt > 25) {
      // jump so the top of the arc lands on the ball's path (solved for this gravity)
      const vyN = Math.sqrt(2 * G_P * (hgt + 8)), tA = vyN / G_P;
      const vxN = clamp((tx - c.x) / tA, -DASH * 0.6, DASH * 0.6);
      pw = clamp(Math.hypot(vxN, vyN) / DASH, 0.2, 1);
      tx = c.x + vxN; ty = c.y - vyN;
    }
  } else if (!behind) {
    // The ball is on the CPU's goal side. Never touch it from here (that sends it into the CPU's own goal).
    // Go over the top to the far side; if that path would clip the ball, climb straight up first.
    const clearY = Math.max(py - (PR + BR + 70), PR + 6);
    tx = Math.min(px + 110, W - PR - 2);
    ty = Math.max(clearY - 30, PR + 6);
    if (segDist(c.x, c.y, tx, ty, px, py) < PR + BR + 14) { tx = c.x - 25; ty = c.y - 130; }
  } else if (d.guard && px < W * 0.3 && dist > 260) {
    // ball is far in your half: hold a defensive spot
    tx = W * 0.64; ty = GROUND - PR;
    if (Math.abs(c.x - tx) < 45 && c.onGround) return;
  } else {
    // Better players pick the corner of the goal furthest from you.
    const gx = 0, gy = d.t > 0.45 ? (human.y < GROUND - PR - 70 ? GROUND - 30 : CROSS_BOT + 28) : GROUND - GOAL_H * 0.55;
    let ux = gx - px, uy = gy - py;
    const ul = Math.hypot(ux, uy) || 1;
    ux /= ul; uy /= ul;
    const ax = px - ux * (PR + BR), ay = py - uy * (PR + BR);
    // Only strike when the swing, aimed at where the ball is right now, points clearly toward the
    // human's goal. Otherwise line up first, so the CPU never sweeps past or under the ball and
    // pushes it back toward its own goal.
    const rx = b.x - c.x, ry = b.y - c.y, rl = Math.hypot(rx, ry) || 1;
    if (rl < d.hitR && rx / rl < -0.55) {
      tx = c.x + rx / rl * 300;
      ty = c.y + ry / rl * 300;
      // a hard shot into the wall above the goal comes straight back, so ease off on those
      const yWall = b.y + ry * (b.x - BR) / -rx;
      pw = yWall < CROSS_BOT ? 0.5 : 1;
    } else { tx = Math.min(ax, W - PR - 2); ty = Math.min(ay, GROUND - PR); }
  }
  // Human error: wobble the aim and the power a little (more at low skill) so no two moves are alike.
  {
    const ex = tx - c.x, ey = ty - c.y, el = Math.hypot(ex, ey) || 1;
    const base = pw || Math.min(powerFor(el), 0.6 + 0.4 * d.t);
    const ang = Math.atan2(ey, ex) + gauss() * d.aimErr;
    pw = clamp(base * (1 + gauss() * d.powErr), 0.2, 1);
    tx = c.x + Math.cos(ang) * el; ty = c.y + Math.sin(ang) * el;
  }
  // Last check: never dash rightward into the ball, which would shove it toward the CPU's own goal.
  const ddx = tx - c.x, ddy = ty - c.y, ddl = Math.hypot(ddx, ddy) || 1;
  if (ddx / ddl > 0.2 && b.x > c.x - 10 &&
      segDist(c.x, c.y, c.x + ddx / ddl * 380, c.y + ddy / ddl * 380, b.x, b.y) < PR + BR + 30) return;
  launch(c, tx, ty, pw);
}

/* ---------- match flow ---------- */
function beginCountdown(sec) { S.mode = 'countdown'; S.count = sec; S.countMax = sec; }
function startMatch() {
  if (!WC.on) {   // quick match: your chosen team vs a random opponent
    youTeam = teamById(settings.team);
    cpuTeam = youTeam ? shuffle(TEAMS.filter(t => t !== youTeam))[0] : null;
  }
  applyKits();
  S.groupGame = WC.on && WC.phase === 'group';
  S.score = [0, 0]; S.time = settings.len; S.overtime = false; particles = []; acc = 0;
  drag.active = false;
  resetWorld(false);
  beginCountdown(3);
  hideOverlay();
}
function onGoal(side) {
  S.score[side]++;
  S.mode = 'goal'; S.goalT = 1.9; S.scorer = side; S.cheerT = 3.2; S.cheerSide = side;
  S.afterGoal = S.overtime ? 'over' : 'restart';
  confetti(side === 0 ? W - 70 : 70, side === 0 ? C_YOU : C_CPU);
  goalSound();
}
function endMatch() {
  S.mode = 'over';
  whistle();
  if (WC.on) wcFinish(); else showOverlay('over');
}
function toMenu() {
  WC.on = false; WC.sim = null; WC.autoT = 0; youTeam = null; cpuTeam = null; applyKits();
  S.mode = 'menu'; S.score = [0, 0]; S.time = settings.len; S.overtime = false; particles = []; acc = 0;
  resetWorld(true);
  showOverlay('title');
}
function pause() {
  if (S.mode === 'play' || S.mode === 'goal' || S.mode === 'countdown') {
    S.prev = S.mode; S.mode = 'paused'; drag.active = false; showOverlay('pause');
  }
}
function resume() {
  if (S.mode === 'paused') { S.mode = S.prev; hideOverlay(); }
}
function togglePause() { S.mode === 'paused' ? resume() : pause(); }

function update(dt) {
  S.clock += dt;
  updateParticles(dt);
  switch (S.mode) {
    case 'countdown':
      S.count -= dt;
      if (S.count <= 0) { S.mode = 'play'; whistle(); }
      break;
    case 'play':
      if (!S.overtime) {
        S.time -= dt;
        if (S.time <= 0) {
          S.time = 0;
          if (S.score[0] !== S.score[1] || S.groupGame) { endMatch(); break; }   // group games can end level
          S.overtime = true; whistle();
        }
      }
      aiThink(dt);
      runSim(dt);
      break;
    case 'goal':
      runSim(dt);
      S.goalT -= dt;
      if (S.goalT <= 0) {
        if (S.afterGoal === 'over') endMatch();
        else { resetWorld(false); acc = 0; beginCountdown(1.5); }
      }
      break;
    default: break;
  }
}

    }
    ctx.fillStyle = 'rgba(255,255,255,' + (a * (1 - i / 11)) + ')';
    ctx.beginPath(); ctx.arc(tx, ty, 4 - i * 0.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,' + a + ')'; ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(x1 + ux * 10, y1 + uy * 10);
  ctx.lineTo(x1 - uy * 7, y1 + ux * 7);
  ctx.lineTo(x1 + uy * 7, y1 - ux * 7);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function banner(text, sub, color, scale) {
  ctx.save();
  ctx.translate(W / 2, 150); ctx.scale(scale, scale);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = '800 84px "Bricolage Grotesque", system-ui, sans-serif';
  ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(10,20,15,0.6)';
  ctx.strokeText(text, 0, 0); ctx.fillStyle = color; ctx.fillText(text, 0, 0);
  if (sub) {
    ctx.font = '600 22px "Figtree", system-ui, sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(10,20,15,0.6)';
    ctx.strokeText(sub, 0, 52); ctx.fillStyle = '#fff'; ctx.fillText(sub, 0, 52);
  }
  ctx.restore();
}
function render() {
  const s = cv.width / W;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.drawImage(bgEmpty, 0, 0, W, H); drawCrowd(performance.now() / 1000);
  shadow(human.x, human.y + PR, PR); shadow(cpu.x, cpu.y + PR, PR); shadow(ball.x, ball.y + BR, BR);
  drawPlayer(human); drawPlayer(cpu);
  drawBall();
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    if (p.rect) ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size * 0.6);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  if (S.mode === 'play') drawAim();
  if (S.mode === 'goal') {
    const el = 1.9 - S.goalT, pop = el < 0.2 ? 0.6 + 0.4 * (el / 0.2) : 1;
    banner('GOAL!', S.scorer === 0 ? 'You score' : cpuLabel() + ' scores', S.scorer === 0 ? C_YOU : C_CPU, pop);
  } else if (S.mode === 'countdown') {
    if (S.countMax === 3) banner(String(Math.max(1, Math.ceil(S.count))), 'Drag and release to launch', '#F6C945', 1);
    else banner('Ready', '', '#F6C945', 1);
  } else if (S.mode === 'play' && S.overtime && S.clock % 2 < 1.4 && S.time === 0) {
    ctx.save();
    ctx.textAlign = 'center'; ctx.font = '800 22px "Bricolage Grotesque", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillText('GOLDEN GOAL', W / 2, 40);
    ctx.restore();
  }
}

/* ---------- main loop ---------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  if (S.cheerT > 0) S.cheerT = Math.max(0, S.cheerT - dt);
  update(dt);
  wcTick(dt);
  hud();
  render();
  requestAnimationFrame(frame);
}
resetWorld(true);
S.time = settings.len;
showOverlay('title');
requestAnimationFrame(frame);
})();
</script>

<title>A Slightly Moderately Large World Cup</title>

<style>
:root {
  /* Layout: scoreboard bar above a 16:9 side-on pitch; menu, pause and result cards float over the pitch.
     Single deliberate look (floodlit match day), so every color is set explicitly in both themes. */
  color-scheme: dark;
  --bg: #0F1B17;
  --panel: #17271F;
  --line: #2B4237;
  --fg: #EDF4EE;
  --muted: #9FB8AA;
  --you: #F2542D;
  --cpu: #3B78E0;
  --accent: #F6C945;
  --accent-ink: #1B1606;
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.app {
  width: 100%;
  max-width: 1040px;
  min-width: 0;
  margin-block: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hud {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 14px;
}
.side { display: flex; align-items: center; gap: 10px; min-width: 0; }
.side.cpu { justify-content: flex-end; }
.swatch { width: 14px; height: 14px; border-radius: 50%; flex: none; background-size: cover; background-position: center; }
.you .swatch { background: var(--you); }
.cpu .swatch { background: var(--cpu); }
.tag {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.score {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 34px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.clock {
  text-align: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 26px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  min-width: 96px;
}
.clock small {
  display: block;
  margin-top: 4px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #2F7A43;
  touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  background: rgba(9, 18, 14, 0.66);
  backdrop-filter: blur(3px);
}
.overlay[hidden] { display: none; }
.card {
  width: min(440px, 100%);
  max-height: 100%;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px 20px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.card h1, .card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  line-height: 1.05;
  text-wrap: balance;
}
.card h1 { font-size: clamp(24px, 5vw, 32px); }
.card h2 { font-size: clamp(26px, 5vw, 34px); }
.sub { margin: 6px 0 0; color: var(--muted); }
.how { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.opt { display: flex; flex-direction: column; gap: 6px; }
.opt > span { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: 600 14px var(--font-body);
  padding: 7px 10px;
  border-radius: 7px;
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.primary, .ghost {
  font: 600 16px var(--font-body);
  padding: 11px 16px;
  border-radius: 10px;
  cursor: pointer;
  border: 1px solid transparent;
}
.primary { background: var(--accent); color: var(--accent-ink); }
.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.danger { background: #C8102E; color: #fff; }
.skillrow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.skillrow > span { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.skillrow b { font-family: var(--font-display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.range { width: 100%; margin: 2px 0; accent-color: var(--accent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1; }
.result { font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
.card.wide { width: min(720px, 100%); }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 6px; }
.team {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; text-align: left;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  color: var(--fg); font: 600 14px var(--font-body); cursor: pointer;
}
.team:hover { border-color: var(--accent); }
.team[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip { background-size: cover; background-position: center; width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid rgba(255,255,255,0.4); }
.bracket { display: grid; grid-template-columns: repeat(4, minmax(66px, 1fr)); gap: 6px; }
.bcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bcol h3 { margin: 0; font: 600 10px var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.bms { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 6px; }
.bm { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 12px; }
.bm.me { border-color: var(--accent); }
.bt { display: flex; align-items: center; gap: 5px; padding: 3px 6px; min-height: 22px; }
.bt.w { font-weight: 700; }
.bt.l { color: var(--muted); }
.dense .bt { min-height: 19px; padding: 2px 5px; font-size: 11px; }
.dense .bm { font-size: 11px; }
.dense6 .bt { min-height: 16px; padding: 1px 4px; font-size: 10px; }
.dense6 .bms { gap: 3px; }
.bt .sc { margin-left: auto; font-variant-numeric: tabular-nums; }
.bt .chip { width: 9px; height: 9px; border-width: 1px; }
.card.xl { width: min(920px, 100%); }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.grp { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px 8px; font-size: 12px; }
.grp.me { border-color: var(--accent); }
.grp h3 { margin: 0 0 4px; font: 600 10px var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.gr { display: grid; grid-template-columns: 1fr 18px 28px 28px; align-items: center; gap: 4px; padding: 2px 0 2px 6px; border-left: 3px solid transparent; }
.gr.q { border-left-color: var(--accent); }
.gr.q3 { border-left-color: #9a8a3c; }
.gr.cut { border-bottom: 1px dashed var(--line); padding-bottom: 4px; margin-bottom: 2px; }
.gr small { color: var(--muted); font-size: 10px; }
.thirds { max-width: 330px; }
.gr.hd { color: var(--muted); font-size: 10px; }
.gr .n { display: flex; align-items: center; gap: 5px; min-width: 0; }
.gr .v { text-align: right; font-variant-numeric: tabular-nums; }
.lgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.lg { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; font-weight: 600; }
.lg .t { display: flex; align-items: center; gap: 6px; min-width: 0; }
.lg .t.r { justify-content: flex-end; }
.lg .sc { font-family: var(--font-display); font-weight: 800; font-size: 18px; min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; }
.lg .sc span { display: inline-block; }
.pop { animation: pop 0.5s ease-out; }
@keyframes pop { 0% { transform: scale(1.7); color: var(--accent); } 100% { transform: scale(1); } }
.mins { margin: 0; font: 700 14px var(--font-body); color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: 0.06em; text-transform: uppercase; }
.champ { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  color: var(--muted);
  font-size: 13px;
}
.bar p { margin: 0; min-width: 0; }
.btns { display: flex; gap: 8px; }
.btn {
  font: 600 13px var(--font-body);
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
@media (max-width: 700px) { .overlay.full { position: fixed; z-index: 20; } }
@media (max-width: 520px) {
  .hud { padding: 8px 10px; gap: 8px; }
  .score { font-size: 28px; }
  .clock { font-size: 22px; min-width: 76px; }
  .tag { font-size: 11px; letter-spacing: 0.1em; }
  .card { padding: 14px; gap: 10px; }
  .how { font-size: 13px; }
}
html.rot body { padding: 0; display: block; }
html.rot .app { position: fixed; top: 0; left: 100vw; width: 100vh; width: 100dvh; height: 100vw; height: 100dvw; max-width: none; margin: 0;
  padding: 10px 14px; justify-content: center; transform-origin: 0 0; transform: rotate(90deg); overflow: hidden; }
html.rot .stage { width: min(100%, calc((100vw - 120px) * 16 / 9)); margin-inline: auto; }
html.rot .bar p { display: none; }
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto; }
}
</style>

const W = 960, H = 540, GROUND = 482;
const GOAL_H = 180, GOAL_W = 70, BAR = 8;
const CROSS_BOT = GROUND - GOAL_H, CROSS_TOP = CROSS_BOT - BAR;
const PR = 38, BR = 15, PM = 5;
// Matched to a reference clip (measured at 30fps): player gravity ~800 px/s^2, ball ~550 px/s^2,
// launch speed at 80% of a full pull ~1110 px/s, so a full pull is ~1390 px/s. No air drag.
const G_P = 800, G_B = 550;

const STEP = 1 / 120;
const MAX_BALL = 1500;

/* ---------- CPU skill rating ----------
   One number from 1 (beginner) to 100 (elite) drives how the CPU plays. Every trait slides smoothly with it:
     speed       shorter launch cooldown and quicker reactions
     perception  reads the ball further ahead and dares to strike from further away
     judgement   how often it stops to defend its goal
     precision   aim and power wobble, and how often it hesitates (the randomness; it shrinks as skill rises)
   Skill 1 is slow and sloppy; skill 100 is fast and nearly exact, but still never perfectly repeatable. */
const lerp = (a, b, t) => a + (b - a) * t;
function gauss() {   // roughly normal, clipped to +-2 standard deviations
  return Math.max(-2, Math.min(2, (Math.random() + Math.random() + Math.random() + Math.random() - 2) * 1.73));
}
function aiParams(skill) {
  const t = Math.max(0, Math.min(1, (skill - 1) / 99)), sloppy = Math.pow(1 - t, 1.5);
  return {
    t,
    cd: lerp(0.42, 0.22, t),                    // seconds between launches (you recharge in 0.22)
    react: lerp(0.30, 0.0, Math.pow(t, 0.7)),   // seconds it waits after a launch recharges
    lead: lerp(0.08, 0.30, t),                  // seconds ahead it predicts the ball
    hitR: lerp(90, 160, t),                     // how far away it will swing at the ball
    keep: 0.55 * Math.max(0, Math.min(1, (skill - 15) / 45)),  // how often it thinks about defending
    aimErr: 0.01 + 0.28 * sloppy,               // aim wobble, radians (one standard deviation)
    powErr: 0.01 + 0.22 * sloppy,               // power wobble, fraction of the launch
    slip: 0.18 * Math.pow(1 - t, 2)             // chance of a brain-fade before a move
  };
}
function skillName(s) {
  return s < 20 ? 'Beginner' : s < 40 ? 'Casual' : s < 60 ? 'Club' : s < 80 ? 'Advanced' : s < 95 ? 'Expert' : 'Elite';
}

  g = bgEmpty.getContext('2d');
  g.setTransform(bgEmpty.width / W, 0, 0, bgEmpty.height / H, 0, 0);
  drawStatic(g, true);
}
const CROWD_COLS = ['#F2542D', '#3B78E0', '#F6C945', '#EDF4EE', '#8FB2CC', '#C9D6DE', '#2B3E4E'];
let crowdList = null;
function drawCrowd(tNow) {
  const sTop = 150, boardTop = GROUND - 34 - 38;
  if (!crowdList) {
    crowdList = [];
    const rows = Math.floor((boardTop - sTop - 8) / 10);
    for (let row = 0; row < rows; row++) for (let c = 0; c < W / 10; c++)
      crowdList.push({ x: c * 10 + 5 + (row % 2) * 5, y: sTop + 10 + row * 10, ci: (row * 131 + c * 57 + ((row * c) % 7) * 13) % CROWD_COLS.length, ph: ((row * 37 + c * 91) % 100) / 100 * 6.28, arm: (row * 7 + c * 3) % 3 });
  }
  const k = clamp(S.cheerT / 0.8, 0, 1), gx = S.cheerSide === 0 ? W - 70 : 70;
  ctx.save(); ctx.globalAlpha = 0.6;
  for (const p of crowdList) {
    const near = 0.55 + 0.45 * Math.exp(-Math.abs(p.x - gx) / 360);
    const bob = Math.abs(Math.sin(tNow * 9 + p.ph)) * 8 * k * near + (0.5 + 0.5 * Math.sin(tNow * 1.7 + p.ph * 2)) * 2.6 * (1 - k);
    const y = p.y - bob, sx = Math.sin(tNow * 1.1 + p.ph) * 1.4 * (1 - k);
    ctx.fillStyle = CROWD_COLS[p.ci];
    if (k > 0.05 && p.arm) {   // raised arms
      const sw = Math.sin(tNow * 12 + p.ph) * 2 * k;
      ctx.strokeStyle = CROWD_COLS[p.ci]; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(p.x - 2.5, y + 1); ctx.lineTo(p.x - 4 + sw, y - 6 * k); ctx.moveTo(p.x + 2.5, y + 1); ctx.lineTo(p.x + 4 + sw, y - 6 * k); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(p.x + sx, y, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function applyRot() {
  document.documentElement.classList.toggle('rot', !!settings.rot);
  const b = $('btnRot'); if (b) { b.setAttribute('aria-pressed', String(!!settings.rot)); b.textContent = settings.rot ? 'Unrotate' : 'Rotate'; }
  resize();
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.round(stage.clientWidth * dpr));
  const h = Math.round(w * H / W);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; buildStatic(); }
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);
$('btnRot').addEventListener('click', () => { settings.rot = !settings.rot; saveSettings(); applyRot(); });
applyRot();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildStatic);

/* ---------- drawing ---------- */
function shadow(x, bottomY, r) {
  const h = Math.max(0, GROUND - bottomY);
  const k = clamp(1 - h / 380, 0.25, 1);
  ctx.fillStyle = 'rgba(0,0,0,' + (0.24 * k) + ')';
  ctx.beginPath(); ctx.ellipse(x, GROUND + 3, r * k * 1.05, r * 0.28 * k, 0, 0, Math.PI * 2); ctx.fill();
}
function drawPlayer(p) {
  const col = p.side ? C_CPU : C_YOU, dark = p.side ? D_CPU : D_YOU;
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.dashT > 0) {
    const st = clamp(Math.hypot(p.vx, p.vy) / 2600, 0, 0.18), ang = Math.atan2(p.vy, p.vx);
    ctx.rotate(ang); ctx.scale(1 + st, 1 - st); ctx.rotate(-ang);
  }
  ctx.scale(PR / 30, PR / 30);   // art is drawn for a radius-30 body
  // boot
  const fl = Math.hypot(p.fx, p.fy) || 1, bx = p.fx / fl, by = p.fy / fl;
  const reach = p.dashT > 0 ? 26 : 24;
  ctx.save();
  ctx.translate(bx * reach, by * reach); ctx.rotate(Math.atan2(by, bx));
  ctx.fillStyle = '#1B1B1F'; ctx.beginPath(); ctx.ellipse(0, 0, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#EDEDED'; ctx.fillRect(1, -1, 4, 2);
  ctx.restore();
  // body
  const team = p.side ? cpuTeam : youTeam;
  ctx.fillStyle = col; ctx.strokeStyle = dark; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 30 - 4, 0, Math.PI * 2);
  if (team) {   // the body is the country's flag
    ctx.save(); ctx.clip();
    flagBox(ctx, team.id, -34, -26, 68, 52);
    const sh = ctx.createRadialGradient(-8, -9, 4, 0, 0, 27);
    sh.addColorStop(0, 'rgba(255,255,255,0.22)'); sh.addColorStop(0.55, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = sh; ctx.fillRect(-30, -30, 60, 60);
    ctx.restore();
    ctx.beginPath(); ctx.arc(0, 0, 30 - 4, 0, Math.PI * 2);   // flag drawing reused the path
    ctx.stroke();
  } else {
    ctx.fill(); ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, 30 - 5.5, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(-30, 7, 60, 7);
    ctx.restore();
  }
  // eyes follow the ball
  const lx = ball.x - p.x, ly = ball.y - p.y, ll = Math.hypot(lx, ly) || 1;
  const ex = lx / ll * 2.6, ey = ly / ll * 2.6;
  for (const sx of [-8, 8]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx, -5, 5.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(10,20,30,0.7)'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = '#14202A'; ctx.beginPath(); ctx.arc(sx + ex, -5 + ey, 2.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  if (p.side === 0 && S.mode === 'play' && p.cd > 0) {
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.arc(p.x, p.y, PR + 7, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(p.x, p.y, PR + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - p.cd / p.cdMax)); ctx.stroke();
  }
}
function drawBall() {
  const b = ball;
  ctx.save();
  ctx.translate(b.x, b.y); ctx.rotate(b.ang);
  ctx.fillStyle = '#FAFAF7'; ctx.strokeStyle = '#1A1A1D'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, BR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1A1A1D';
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2 - Math.PI / 2, px = Math.cos(a) * 5.2, py = Math.sin(a) * 5.2;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2 - Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * 5.2, Math.sin(a) * 5.2); ctx.lineTo(Math.cos(a) * 10.5, Math.sin(a) * 10.5); ctx.stroke();
    const a2 = a + Math.PI / 5;
    ctx.beginPath(); ctx.arc(Math.cos(a2) * 12.2, Math.sin(a2) * 12.2, 2.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawAim() {
  if (!drag.active) return;
  // rubber band from where you pressed to where the pointer is now
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(drag.sx, drag.sy); ctx.lineTo(drag.cx, drag.cy); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(drag.sx, drag.sy, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  const v = dragVec();
  if (v.len < 12) return;
  const ux = v.ux, uy = v.uy, pw = v.pw;
  const len = Math.max(MAXR * pw, PR + 26);
  const x0 = human.x + ux * (PR + 10), y0 = human.y + uy * (PR + 10);
  const x1 = human.x + ux * len, y1 = human.y + uy * len;
  const a = human.cd > 0.08 ? 0.3 : 0.9;
  // faint disc marks where a full-power pull would reach
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.arc(human.x + ux * MAXR, human.y + uy * MAXR, 13, 0, Math.PI * 2); ctx.fill();
  // predicted flight path
  let tx = human.x, ty = human.y, tvx = ux * DASH * pw, tvy = uy * DASH * pw;
  for (let i = 1; i <= 9; i++) {
    for (let k = 0; k < 5; k++) {
      const h = 0.012;
      tvy += G_P * h; tx += tvx * h; ty += tvy * h; tvx *= Math.exp(-0.05 * h);
      if (ty > GROUND - PR) { ty = GROUND - PR; tvy = 0; tvx *= Math.exp(-3.6 * h); }
    }
    ctx.fillStyle = 'rgba(255,255,255,' + (a * (1 - i / 11)) + ')';
    ctx.beginPath(); ctx.arc(tx, ty, 4 - i * 0.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,' + a + ')'; ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(x1 + ux * 10, y1 + uy * 10);
  ctx.lineTo(x1 - uy * 7, y1 + ux * 7);
  ctx.lineTo(x1 + uy * 7, y1 - ux * 7);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function banner(text, sub, color, scale) {
  ctx.save();
  ctx.translate(W / 2, 150); ctx.scale(scale, scale);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = '800 84px "Bricolage Grotesque", system-ui, sans-serif';
  ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(10,20,15,0.6)';
  ctx.strokeText(text, 0, 0); ctx.fillStyle = color; ctx.fillText(text, 0, 0);
  if (sub) {
    ctx.font = '600 22px "Figtree", system-ui, sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(10,20,15,0.6)';
    ctx.strokeText(sub, 0, 52); ctx.fillStyle = '#fff'; ctx.fillText(sub, 0, 52);
  }
  ctx.restore();
}
function render() {
  const s = cv.width / W;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  const murder = S.mode === 'murder';
  if (murder) { const c = mCamera(S.mt); ctx.save(); ctx.scale(c[0], c[0]); ctx.translate(-c[1], -c[2]); }
  ctx.drawImage(bgEmpty, 0, 0, W, H); drawCrowd(performance.now() / 1000);
  drawRef();
  if (!murder) { shadow(human.x, human.y + PR, PR); shadow(cpu.x, cpu.y + PR, PR); shadow(ball.x, ball.y + BR, BR); }
  if (S.mode === 'murder') drawMurder(); else { drawPlayer(human); drawPlayer(cpu); }
  if (S.mode !== 'murder') drawBall();
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    if (p.rect) ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size * 0.6);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  if (murder) { drawMurderOverlay(); ctx.restore(); drawMurderFrame(S.mt); }
  if (S.mode === 'play') drawAim();
  if (S.mode === 'goal') {
    const el = 1.9 - S.goalT, pop = el < 0.2 ? 0.6 + 0.4 * (el / 0.2) : 1;
    banner('GOAL!', S.scorer === 0 ? 'You score' : cpuLabel() + ' scores', S.scorer === 0 ? C_YOU : C_CPU, pop);
  } else if (S.mode === 'countdown') {
    if (S.countMax === 3) banner(String(Math.max(1, Math.ceil(S.count))), 'Drag and release to launch', '#F6C945', 1);
    else banner('Ready', '', '#F6C945', 1);
  } else if (S.mode === 'play' && S.overtime && S.clock % 2 < 1.4 && S.time === 0) {
    ctx.save();
    ctx.textAlign = 'center'; ctx.font = '800 22px "Bricolage Grotesque", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillText('GOLDEN GOAL', W / 2, 40);
    ctx.restore();
  }
}

/* ---------- main loop ---------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  if (S.cheerT > 0) S.cheerT = Math.max(0, S.cheerT - dt);
  update(dt);
  wcTick(dt);
  hud();
  render();
  requestAnimationFrame(frame);
}
resetWorld(true);
S.time = settings.len;
showOverlay('title');
requestAnimationFrame(frame);
})();
</script>
